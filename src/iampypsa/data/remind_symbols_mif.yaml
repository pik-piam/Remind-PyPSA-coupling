# IAMC / .mif symbol map for the REMIND→PyPSA coupling.
#
# This is remind_symbols_mif.yaml, parallel to remind_symbols_gdx.yaml;
# selected by load_symbol_specs(backend="iamc").
#
# Technology labels use the CANONICAL vocabulary directly (gas-ccgt, coal-pulverised,
# solar-pv, ...) — the same names remind_symbols_gdx.yaml's technology_names block maps the
# raw REMIND tokens to. The labels here are invented (never read from the mif), so no token
# detour and no technology_names block is needed for this backend. A test asserts the two
# files' vocabularies agree.
#
# Spec shapes:
#
# (1) Single-quantity symbol
#       symbol: "IAMC variable name"
#       rename: {source_col: canonical_col}  — optional; read_iamc already uses lowercase names
#       unit / to_unit  — optional unit conversion
#
# (2) Variable-set  (IAMC-specific — one logical quantity from many IAMC variables):
#       variables:  {IAMC variable name: canonical_name, ...}
#       derived:    {canonical_name: [[coeff, IAMC variable], ...]}   — optional linear combos
#       label_col:  column name for the label (default: technology)
#       to_unit:    target unit (source unit is read from the 'Unit' column of the mif)
#       fallback:   {canonical_name: {value: <float>, reason: <str>}} — temporary gaps; logged
#
# Unit strings must match the mif's 'Unit' column exactly and exist in iampypsa.units.UNIT_CONVERSIONS.

default:
  # --- Technology -> fuel map ------------------------------------------------
  # Canonical technology -> canonical fuel; identical to remind_symbols_gdx.yaml's block
  # (a test asserts they agree). Used by the adapter to broadcast per-fuel price rows into
  # one `fuel` row per technology.
  tech_fuel_map:
    coal-pulverised: coal-fuel
    coal-igcc: coal-fuel
    coal-igcc-ccs: coal-fuel
    coal-chp: coal-fuel
    gas-ocgt: gas-fuel
    gas-ccgt: gas-fuel
    gas-ccgt-ccs: gas-fuel
    gas-chp: gas-fuel
    oil: oil-fuel
    biomass-chp: biomass-fuel
    biomass-igcc: biomass-fuel
    biomass-igcc-ccs: biomass-fuel
    nuclear: uranium

  # --- CO2 price -----------------------------------------------------------
  co2_price:
    symbol: "Price|Carbon"
    unit: "US$2017/t CO2"

  # --- Discount rate -------------------------------------------------------
  discount_rate:
    symbol: "Interest Rate t/(t-1)|Real"
    unit: "unitless"

  # --- Installed capacities ------------------------------------------------
  # Variable-set: one IAMC Cap|… variable per technology.
  # Link techs (electrolysis, hydrogen-turbine, battery-inverter) still need their
  # output-basis capacity divided by efficiency to get PyPSA input-basis p_nom.
  # Derived: coal-pulverised and biomass-igcc have no own Cap| variable; residuals.
  capacity:
    consolidation:
      link_techs: [electrolysis, hydrogen-turbine]
    variables:
      "Cap|Electricity|Gas|GT":                gas-ocgt
      "Cap|Electricity|Gas|CC|w/o CC":         gas-ccgt
      "Cap|Electricity|Gas|CC|w/ CC":          gas-ccgt-ccs
      "Cap|Electricity|Gas|CHP":               gas-chp
      "Cap|Electricity|Coal|CHP":              coal-chp
      "Cap|Electricity|Coal|IGCC|w/o CC":      coal-igcc
      "Cap|Electricity|Coal|IGCC|w/ CC":       coal-igcc-ccs
      "Cap|Electricity|Biomass|CHP":           biomass-chp
      "Cap|Electricity|Biomass|w/ CC":         biomass-igcc-ccs
      "Cap|Electricity|Nuclear":               nuclear
      "Cap|Electricity|Wind|Onshore":          wind-onshore
      "Cap|Electricity|Wind|Offshore":         wind-offshore
      "Cap|Electricity|Solar|PV":              solar-pv
      "Cap|Electricity|Solar|CSP":             solar-csp
      "Cap|Electricity|Oil|w/o CC":            oil
      "Cap|Electricity|Geothermal":            geothermal
      "Cap|Hydrogen|Electricity":              electrolysis
      "Cap|Electricity|Hydrogen":              hydrogen-turbine
      "Cap|Electricity|Storage|Battery":       battery-inverter
    derived:
      # coal-pulverised = (all coal w/o CC) − IGCC − CHP
      coal-pulverised:
        - [1.0,  "Cap|Electricity|Coal|w/o CC"]
        - [-1.0, "Cap|Electricity|Coal|IGCC|w/o CC"]
        - [-1.0, "Cap|Electricity|Coal|CHP"]
      # biomass-igcc = biomass IGCC w/o CC = (all biomass w/o CC) − CHP
      biomass-igcc:
        - [1.0,  "Cap|Electricity|Biomass|w/o CC"]
        - [-1.0, "Cap|Electricity|Biomass|CHP"]
    label_col: technology
    to_unit: MW

  # --- Cost parameters — one variable-set per parameter -------------------
  cost_investment:
    variables:
      "Tech|Electricity|Gas|Gas Turbine|Capital Costs":                         gas-ocgt
      "Tech|Electricity|Gas|Combined Cycle w/o CC|Capital Costs":               gas-ccgt
      "Tech|Electricity|Gas|Combined Cycle w/ CC|Capital Costs":                gas-ccgt-ccs
      "Tech|Electricity|Gas|Combined Heat and Power w/o CC|Capital Costs":      gas-chp
      "Tech|Electricity|Coal|Pulverised Coal w/o CC|Capital Costs":             coal-pulverised
      "Tech|Electricity|Coal|Combined Heat and Power w/o CC|Capital Costs":     coal-chp
      "Tech|Electricity|Coal|Gasification Combined Cycle w/o CC|Capital Costs": coal-igcc
      "Tech|Electricity|Coal|Gasification Combined Cycle w/ CC|Capital Costs":  coal-igcc-ccs
      "Tech|Electricity|Biomass|Combined Heat and Power w/o CC|Capital Costs":  biomass-chp
      "Tech|Electricity|Biomass|Gasification Combined Cycle w/o CC|Capital Costs": biomass-igcc
      "Tech|Electricity|Biomass|Gasification Combined Cycle w/ CC|Capital Costs":  biomass-igcc-ccs
      "Tech|Electricity|Nuclear|Capital Costs":                                 nuclear
      "Tech|Electricity|Wind|Onshore|Capital Costs":                            wind-onshore
      "Tech|Electricity|Wind|Offshore|Capital Costs":                           wind-offshore
      "Tech|Electricity|Solar|PV|Capital Costs":                                solar-pv
      "Tech|Electricity|Solar|CSP|Capital Costs":                               solar-csp
      "Tech|Electricity|Oil|DOT|Capital Costs":                                 oil
      "Tech|Electricity|Geothermal|Capital Costs":                              geothermal
      "Tech|Hydrogen|Electricity|Capital Costs":                                electrolysis
      "Tech|Electricity|Hydrogen|Capital Costs":                                hydrogen-turbine
      "Tech|Electricity|Hydro|Capital Costs":                                   hydro
    label_col: technology
    to_unit: "USD/MW"

  # Lifetime: factor 1.0 — unit string differs between mif and GDX.
  tech_lifetime:
    variables:
      "Tech|Electricity|Gas|Gas Turbine|Lifetime":                         gas-ocgt
      "Tech|Electricity|Gas|Combined Cycle w/o CC|Lifetime":               gas-ccgt
      "Tech|Electricity|Gas|Combined Cycle w/ CC|Lifetime":                gas-ccgt-ccs
      "Tech|Electricity|Gas|Combined Heat and Power w/o CC|Lifetime":      gas-chp
      "Tech|Electricity|Coal|Pulverised Coal w/o CC|Lifetime":             coal-pulverised
      "Tech|Electricity|Coal|Combined Heat and Power w/o CC|Lifetime":     coal-chp
      "Tech|Electricity|Coal|Gasification Combined Cycle w/o CC|Lifetime": coal-igcc
      "Tech|Electricity|Coal|Gasification Combined Cycle w/ CC|Lifetime":  coal-igcc-ccs
      "Tech|Electricity|Biomass|Combined Heat and Power w/o CC|Lifetime":  biomass-chp
      "Tech|Electricity|Biomass|Gasification Combined Cycle w/o CC|Lifetime": biomass-igcc
      "Tech|Electricity|Biomass|Gasification Combined Cycle w/ CC|Lifetime":  biomass-igcc-ccs
      "Tech|Electricity|Nuclear|Lifetime":                                 nuclear
      "Tech|Electricity|Wind|Onshore|Lifetime":                            wind-onshore
      "Tech|Electricity|Wind|Offshore|Lifetime":                           wind-offshore
      "Tech|Electricity|Solar|PV|Lifetime":                                solar-pv
      "Tech|Electricity|Solar|CSP|Lifetime":                               solar-csp
      "Tech|Electricity|Oil|DOT|Lifetime":                                 oil
      "Tech|Electricity|Geothermal|Lifetime":                              geothermal
      "Tech|Hydrogen|Electricity|Lifetime":                                electrolysis
      "Tech|Electricity|Hydrogen|Lifetime":                                hydrogen-turbine
      "Tech|Electricity|Hydro|Lifetime":                                   hydro
    label_col: technology
    to_unit: yr

  # NOTE: PyPSA needs FOM as %/yr; the IAMC adapter divides by capex and multiplies by 100.
  cost_omf:
    variables:
      "Tech|Electricity|Gas|Gas Turbine|OM Cost|fixed":                         gas-ocgt
      "Tech|Electricity|Gas|Combined Cycle w/o CC|OM Cost|fixed":               gas-ccgt
      "Tech|Electricity|Gas|Combined Cycle w/ CC|OM Cost|fixed":                gas-ccgt-ccs
      "Tech|Electricity|Gas|Combined Heat and Power w/o CC|OM Cost|fixed":      gas-chp
      "Tech|Electricity|Coal|Pulverised Coal w/o CC|OM Cost|fixed":             coal-pulverised
      "Tech|Electricity|Coal|Combined Heat and Power w/o CC|OM Cost|fixed":     coal-chp
      "Tech|Electricity|Coal|Gasification Combined Cycle w/o CC|OM Cost|fixed": coal-igcc
      "Tech|Electricity|Coal|Gasification Combined Cycle w/ CC|OM Cost|fixed":  coal-igcc-ccs
      "Tech|Electricity|Biomass|Combined Heat and Power w/o CC|OM Cost|fixed":  biomass-chp
      "Tech|Electricity|Biomass|Gasification Combined Cycle w/o CC|OM Cost|fixed": biomass-igcc
      "Tech|Electricity|Biomass|Gasification Combined Cycle w/ CC|OM Cost|fixed":  biomass-igcc-ccs
      "Tech|Electricity|Nuclear|OM Cost|fixed":                                 nuclear
      "Tech|Electricity|Wind|Onshore|OM Cost|fixed":                            wind-onshore
      "Tech|Electricity|Wind|Offshore|OM Cost|fixed":                           wind-offshore
      "Tech|Electricity|Solar|PV|OM Cost|fixed":                                solar-pv
      "Tech|Electricity|Solar|CSP|OM Cost|fixed":                               solar-csp
      "Tech|Electricity|Oil|DOT|OM Cost|fixed":                                 oil
      "Tech|Electricity|Geothermal|OM Cost|fixed":                              geothermal
      "Tech|Hydrogen|Electricity|OM Cost|fixed":                                electrolysis
      "Tech|Electricity|Hydrogen|OM Cost|fixed":                                hydrogen-turbine
      "Tech|Electricity|Hydro|OM Cost|fixed":                                   hydro
    label_col: technology
    to_unit: "USD/MW/yr"

  # Variable O&M, per unit energy output.
  cost_omv:
    variables:
      "Tech|Electricity|Gas|Gas Turbine|OM Cost|variable":                         gas-ocgt
      "Tech|Electricity|Gas|Combined Cycle w/o CC|OM Cost|variable":               gas-ccgt
      "Tech|Electricity|Gas|Combined Cycle w/ CC|OM Cost|variable":                gas-ccgt-ccs
      "Tech|Electricity|Gas|Combined Heat and Power w/o CC|OM Cost|variable":      gas-chp
      "Tech|Electricity|Coal|Pulverised Coal w/o CC|OM Cost|variable":             coal-pulverised
      "Tech|Electricity|Coal|Combined Heat and Power w/o CC|OM Cost|variable":     coal-chp
      "Tech|Electricity|Coal|Gasification Combined Cycle w/o CC|OM Cost|variable": coal-igcc
      "Tech|Electricity|Coal|Gasification Combined Cycle w/ CC|OM Cost|variable":  coal-igcc-ccs
      "Tech|Electricity|Biomass|Combined Heat and Power w/o CC|OM Cost|variable":  biomass-chp
      "Tech|Electricity|Biomass|Gasification Combined Cycle w/o CC|OM Cost|variable": biomass-igcc
      "Tech|Electricity|Biomass|Gasification Combined Cycle w/ CC|OM Cost|variable":  biomass-igcc-ccs
      "Tech|Electricity|Nuclear|OM Cost|variable":                                 nuclear
      "Tech|Electricity|Wind|Onshore|OM Cost|variable":                            wind-onshore
      "Tech|Electricity|Wind|Offshore|OM Cost|variable":                           wind-offshore
      "Tech|Electricity|Solar|PV|OM Cost|variable":                                solar-pv
      "Tech|Electricity|Solar|CSP|OM Cost|variable":                               solar-csp
      "Tech|Electricity|Oil|DOT|OM Cost|variable":                                 oil
      "Tech|Electricity|Geothermal|OM Cost|variable":                              geothermal
      "Tech|Hydrogen|Electricity|OM Cost|variable":                                electrolysis
      "Tech|Electricity|Hydrogen|OM Cost|variable":                                hydrogen-turbine
      "Tech|Electricity|Hydro|OM Cost|variable":                                   hydro
    label_col: technology
    to_unit: "USD/MWh"

  # Efficiency for link-capacity adjustment (output→input basis).
  # Used by build_capacity_targets; subset of the full efficiency variable-set.
  efficiency_conv:
    variables:
      "Tech|Hydrogen|Electricity|Efficiency":  electrolysis
      "Tech|Electricity|Hydrogen|Efficiency":  hydrogen-turbine
    label_col: technology
    to_unit: "p.u."

  # Nuclear is absent from this variable-set — see nuclear special case below.
  efficiency:
    variables:
      "Tech|Electricity|Gas|Gas Turbine|Efficiency":                         gas-ocgt
      "Tech|Electricity|Gas|Combined Cycle w/o CC|Efficiency":               gas-ccgt
      "Tech|Electricity|Gas|Combined Cycle w/ CC|Efficiency":                gas-ccgt-ccs
      "Tech|Electricity|Gas|Combined Heat and Power w/o CC|Efficiency":      gas-chp
      "Tech|Electricity|Coal|Pulverised Coal w/o CC|Efficiency":             coal-pulverised
      "Tech|Electricity|Coal|Combined Heat and Power w/o CC|Efficiency":     coal-chp
      "Tech|Electricity|Coal|Gasification Combined Cycle w/o CC|Efficiency": coal-igcc
      "Tech|Electricity|Coal|Gasification Combined Cycle w/ CC|Efficiency":  coal-igcc-ccs
      "Tech|Electricity|Biomass|Combined Heat and Power w/o CC|Efficiency":  biomass-chp
      "Tech|Electricity|Biomass|Gasification Combined Cycle w/o CC|Efficiency": biomass-igcc
      "Tech|Electricity|Biomass|Gasification Combined Cycle w/ CC|Efficiency":  biomass-igcc-ccs
      "Tech|Electricity|Wind|Onshore|Efficiency":                            wind-onshore
      "Tech|Electricity|Wind|Offshore|Efficiency":                           wind-offshore
      "Tech|Electricity|Solar|PV|Efficiency":                                solar-pv
      "Tech|Electricity|Solar|CSP|Efficiency":                               solar-csp
      "Tech|Electricity|Oil|DOT|Efficiency":                                 oil
      "Tech|Electricity|Geothermal|Efficiency":                              geothermal
      "Tech|Hydrogen|Electricity|Efficiency":                                electrolysis
      "Tech|Electricity|Hydrogen|Efficiency":                                hydrogen-turbine
      "Tech|Electricity|Hydro|Efficiency":                                   hydro
    label_col: technology
    to_unit: "p.u."

  # Fuel prices: Price|Primary Energy|*.
  # Nuclear is intentionally excluded here — its mif price is mass-basis (US$2017/kg_Ur), not
  # energy-basis, so it can't share this group's unit conversion. See `nuclear_conversion_factor`
  # / `nuclear_price` below.
  fuel_price:
    variables:
      "Price|Primary Energy|Coal":        coal-fuel
      "Price|Primary Energy|Gas":         gas-fuel
      "Price|Primary Energy|Oil":         oil-fuel
      "Price|Primary Energy|Biomass|Modern": biomass-fuel
    label_col: technology
    to_unit: "USD/MWh"

  # --- Nuclear special case — uranium mass-basis price and conversion factor ------------------
  # REMIND parametrises nuclear on a uranium-mass basis instead of the energy-basis price/p.u.
  # efficiency used elsewhere. Read raw here and combined by the adapter (RemindIamcAdapter.
  # _nuclear_fuel_cost) into a $/MWh_el fuel cost, with efficiency injected as 1.0 p.u.
  nuclear_conversion_factor:
    symbol: "Tech|Electricity|Nuclear|Efficiency|Conversion factor"
    unit: "GJ_el/kg_Ur"
  nuclear_price:
    symbol: "Price|Primary Energy|Nuclear"
    unit: "US$2017/kg_Ur"

  # CO2 emission intensity, thermal-input basis (t_CO2/MWh_th). Biomass (biomass-chp,
  # biomass-igcc) has no mif variable — REMIND treats it as carbon-neutral, so 0.0 is a real
  # fallback, not a gap. Zero-emission technologies (renewables, nuclear, electrolysis,
  # hydrogen-turbine) have no mif variable either, for the same reason (no direct emissions).
  emission_factor:
    variables:
      "Tech|Electricity|Gas|Gas Turbine|CO2 emission factor thermal input":                         gas-ocgt
      "Tech|Electricity|Gas|Combined Cycle w/o CC|CO2 emission factor thermal input":                gas-ccgt
      "Tech|Electricity|Gas|Combined Cycle w/ CC|CO2 emission factor thermal input":                 gas-ccgt-ccs
      "Tech|Electricity|Gas|Combined Heat and Power w/o CC|CO2 emission factor thermal input":       gas-chp
      "Tech|Electricity|Coal|Pulverised Coal w/o CC|CO2 emission factor thermal input":              coal-pulverised
      "Tech|Electricity|Coal|Combined Heat and Power w/o CC|CO2 emission factor thermal input":      coal-chp
      "Tech|Electricity|Coal|Gasification Combined Cycle w/o CC|CO2 emission factor thermal input":  coal-igcc
      "Tech|Electricity|Coal|Gasification Combined Cycle w/ CC|CO2 emission factor thermal input":   coal-igcc-ccs
      "Tech|Electricity|Biomass|Gasification Combined Cycle w/ CC|CO2 emission factor thermal input": biomass-igcc-ccs
      "Tech|Electricity|Oil|DOT|CO2 emission factor thermal input":                                  oil
    label_col: technology
    to_unit: "t_CO2/MWh_th"
    fallback:
      biomass-chp:      {value: 0.0, reason: "No mif variable; biomass carbon-neutral in REMIND"}
      biomass-igcc:     {value: 0.0, reason: "No mif variable; biomass carbon-neutral in REMIND"}
      solar-pv:         {value: 0.0, reason: "No mif variable; zero-emission technology"}
      wind-onshore:     {value: 0.0, reason: "No mif variable; zero-emission technology"}
      wind-offshore:    {value: 0.0, reason: "No mif variable; zero-emission technology"}
      hydro:            {value: 0.0, reason: "No mif variable; zero-emission technology"}
      nuclear:          {value: 0.0, reason: "No mif variable; zero-emission technology"}
      electrolysis:     {value: 0.0, reason: "No mif variable; zero-emission technology"}
      hydrogen-turbine: {value: 0.0, reason: "No mif variable; zero-emission technology"}

  # --- Demand variables ----------------------------------------------------
  # Read by RemindIamcAdapter.build_regional_demand, which applies the η_td formula and AC
  # residual computation on top. All source units EJ/yr.
  demand_fe_sectors:
    variables:
      "FE|Transport|Pass|Electricity":            EV_pass
      "FE|Transport|Freight|Electricity":         EV_freight
      "FE|Buildings|Heating|Electricity|Heat pump": heatpump
      "FE|Buildings|Heating|Electricity|Resistance": resistive
    label_col: sector
    to_unit: MWh

  demand_se_electricity:
    symbol: "SE|Electricity"
    unit: "EJ/yr"

  demand_transmission_losses:
    symbol: "SE|Electricity|Transmission Losses"
    unit: "EJ/yr"

  # Net electrolysis demand = (H2 produced − H2 consumed by fuel cells) / η_elec.
  # Both SE variables are in EJ H2; dividing by η_elec yields EJ electricity.
  # SE|Input|Hydrogen|Electricity = H2 fed into H2→electricity turbines (hydrogen-turbine).
  # SE|Hydrogen|Electricity       = total H2 produced from electricity (electrolysis).
  demand_h2_from_electricity:
    symbol: "SE|Hydrogen|Electricity"
    unit: "EJ/yr"

  demand_h2_to_turbines:
    symbol: "SE|Input|Hydrogen|Electricity"
    unit: "EJ/yr"

  demand_electrolysis_efficiency:
    symbol: "Tech|Hydrogen|Electricity|Efficiency"
    unit: "%"

  # --- Hydro special case --------------------------------------------------
  # Hydro needs BOTH capacity and generation so the downstream step can derive a
  # capacity factor (generation / (capacity × 8760)) to scale hydro inflow. Read by the
  # dedicated import_REMIND_hydro.py via load_frame — outside the adapter/capacity/cost flow.
  hydro_capacity:
    symbol: "Cap|Electricity|Hydro"
    unit: "GW"
    to_unit: "MW"
  hydro_generation:
    symbol: "SE|Electricity|Hydro"
    unit: "EJ/yr"
    to_unit: "MWh"

overrides: {}
