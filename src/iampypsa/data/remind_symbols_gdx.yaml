# Central REMIND symbol map — one place for all GDX/.mif variable names AND their units.
#
# A logical name is one of two shapes:
#
# (1) Single-quantity symbol — maps a name (or candidate list) to one quantity:
#       symbol:  a source-symbol name OR an ordered candidate list (first present wins —
#                absorbs run/version renames, e.g. v32_* with p32_* fallback). Backend-neutral:
#                the same key addresses a GDX symbol or an IAMC `.mif` variable.
#       rename:  source domain column -> canonical column ({year, region, technology, ...})
#       unit / units / to_unit:  OPTIONAL unit conversion (see below). Resolved via the central
#                (from_unit, to_unit) -> factor table in iampypsa.units. Applied by `load_frame`.
#         - unit:    a single source unit for the whole entry, OR
#         - units:   a list parallel to the `symbol:` candidates (unit of whichever resolves) —
#                    use when a fallback symbol reports in a different unit than the primary.
#         - to_unit: the PyPSA target unit. Conversion is applied only when both are present;
#                    identical units (or no `to_unit`) leave values untouched.
#       unit_factor: OPTIONAL legacy scalar multiplier (kept for simple ad-hoc conversions).
#
# (2) Mixed-unit set symbol — ONE symbol whose `index` column selects several quantities with
#     different units (e.g. pm_data indexed by `char` -> lifetime/FOM/VOM). Loaded by `load_set`:
#       index:   the (renamed) column whose value selects the quantity
#       schema:  index-value -> {parameter, unit, to_unit}; each row is converted independently.
#
# Schema: a single `default` section plus per-REMIND-region `overrides`.
#   overrides: keyed by REMIND region name; each region lists ONLY the logical names whose spec
#              DIFFERS from `default` (everything else, including units/schema, is inherited).
# iampypsa ships these as defaults; a model may overlay its own YAML via load_symbol_specs(path=...)
# or the IAMPYPSA_SYMBOLS env var (deep-merged on top).
#

default:
  # --- Canonical technology vocabulary --------------------------------------
  # REMIND all_te/all_enty token -> canonical name; applied by rename_technologies()
  technology_names:
    ngt: gas-ocgt
    ngcc: gas-ccgt
    ngccc: gas-ccgt-ccs
    gaschp: gas-chp
    pc: coal-pulverised
    igcc: coal-igcc
    igccc: coal-igcc-ccs
    coalchp: coal-chp
    biochp: biomass-chp
    bioigcc: biomass-igcc
    bioigccc: biomass-igcc-ccs
    tnrs: nuclear
    dot: oil
    csp: solar-csp
    geohdr: geothermal
    spv: solar-pv
    windon: wind-onshore
    windoff: wind-offshore
    hydro: hydro
    elh2: electrolysis
    h2turb: hydrogen-turbine
    btin: battery-inverter
    btstor: battery-storage
    h2stor: hydrogen-storage
    pecoal: coal-fuel        # fuel-price tokens; only surface before the per-tech broadcast
    pegas: gas-fuel
    peoil: oil-fuel
    pebiolc: biomass-fuel
    peur: uranium

  # --- Technology -> fuel map ------------------------------------------------
  # The tech->fuel map is derived from the `pe2se` set
  pe2se:
    symbol: pe2se

  co2_price:
    symbol: p_priceCO2
    rename: {tall: year, all_regi: region}
    unit: $/tC
    to_unit: $/tCO2
  # TODO: gdx currently doesn't have space cooling demand yet
  demand_fe_sectors:
    symbol: p32_load_sector
    rename: {ttot: year, all_regi: region, loadPy32: sector}
    unit: TWa
    to_unit: MWh 
  capacity:
    symbol: vm_cap
    rename: {tall: year, all_regi: region, all_te: technology, level: value}
    filter: {rlf: 1}
    unit: TW
    to_unit: MW
    # Electrolysis, hydrogen turbine and battery need postprocessing from gdx
    consolidation:
      vre_to_primary: {elh2VRE: elh2, h2turbVRE: h2turb}   # merge VRE-coupled variants
      battery_scaling: {storspv: 4.0, storwindon: 1.2, storwindoff: 1.2}  # storX -> btin (battery charger)
      link_techs: [elh2, h2turb, btin, elh2VRE, h2turbVRE]  # output->input capacity adjustment
  cost_investment:
    symbol: vm_costTeCapital
    rename: {ttot: year, all_regi: region, all_te: technology, level: value}
    unit: T$/TW
    to_unit: $/MW
  efficiency_conv:
    symbol: pm_eta_conv
    rename: {tall: year, all_regi: region, all_te: technology}
    # p.u. holds for every tech except tnrs (raw TWa_elec/Mt_Ur) — handled in the coupler.
    unit: p.u.
  efficiency_data:
    symbol: pm_dataeta
    rename: {tall: year, all_regi: region, all_te: technology}
    unit: p.u.
  tech_data:
    symbol: pm_data
    rename: {all_regi: region, all_te: technology}
    index: char
    schema:
      lifetime: {parameter: lifetime, unit: yr,     to_unit: yr}
      omf:      {parameter: FOM,      unit: p.u.,   to_unit: "%/yr"}
      omv:      {parameter: VOM,      unit: T$/TWa, to_unit: $/MWh}
  emission_factor:
    symbol: pm_emifac
    rename:
      tall_0: year
      all_regi_1: region
      all_enty_2: from_carrier
      all_enty_3: to_carrier
      all_te_4: technology
      all_enty_5: emission_type
    unit: Gt_C/TWa
    to_unit: t_CO2/MWh
  fuel_price:
    symbol: pm_PEPrice
    rename: {ttot: year, all_regi: region, all_enty: technology}
    # T$/TWa holds for every fuel except peur (raw T$/Mt_Ur) — handled in the coupler.
    unit: T$/TWa
  discount_rate:
    symbol: p_r
    rename: {ttot: year, all_regi: region}
  coupled_years:
    symbol: t
    rename: {ttot: year}
  # Hydro treated as special case in PyPSA-Eur
  hydro_generation:
    symbol: p32_prodSeHydro
    rename: {ttot: year, all_regi: region}
    unit: TWa
    to_unit: MWh

overrides: {}
