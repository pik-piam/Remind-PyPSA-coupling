[project]
name = "IAM-PyPSA-coupling"
version = "0.3.0"
description = "Tools to couple IAMs and PyPSA power models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>1.9",
    "pandas>2",
    "pyyaml",
    "country_converter",
    "typing_extensions"]

[project.urls]
Homepage = "https://github.com/pik-piam/IAM-PyPSA-coupling/"
Documentation = "https://pik-piam.github.io/IAM-PyPSA-coupling/"

# eg `uv pip install -r pyproject.toml --extra release`
[project.optional-dependencies]
jupyter = ["ipykernel","ipython"]
gdx = ["gamspy"]
ssp = ["httpx"]   # live SSP fetch from the IIASA API (iampypsa.reference.ssp.fetch_ssp_data)
test = ["pytest"]
docu= ["mkdocs<2", "mkdocs_gen_files", "mkdocstrings[python]", "mkdocs-literate-nav", "mkdocs-material", "mkdocs-include-dir-to-nav"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"iampypsa.models.remind" = ["*.yaml", "*.csv"]
"iampypsa.models.iamc" = ["*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
# Pure-Python package: no compiled extensions, so no numpy/cython; twine is a publish tool,
# not a build requirement. A bloated requires list slows/poisons the isolated build env.
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"




