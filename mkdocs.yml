site_name: IAM-PyPSA Coupling
site_description: Shared tooling for the IAM - PyPSA soft-coupling (iampypsa)
site_url: https://pik-piam.github.io/IAM-PyPSA-coupling/

# Source repo — drives the header repo link + star/fork counts and the per-page edit button.
repo_url: https://github.com/pik-piam/IAM-PyPSA-coupling
repo_name: pik-piam/IAM-PyPSA-coupling
edit_uri: edit/main/docs/

copyright: Copyright &copy; Potsdam Institute for Climate Impact Research (PIK)

theme:
  name: "material"
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs          # top-level sections as tabs
    - navigation.sections       # group pages in the sidebar
    - navigation.top            # back-to-top button
    - navigation.footer         # prev/next links in the footer
    - navigation.indexes        # section landing pages
    - toc.follow                # sidebar TOC tracks scroll
    - search.suggest
    - search.highlight
    - content.code.copy         # copy button on code blocks
    - content.code.annotate
    - content.tabs.link
    - content.action.edit       # "edit this page" button (uses edit_uri)
    - content.action.view       # "view source" button
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

docs_dir: "./docs"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pik-piam/IAM-PyPSA-coupling
      name: IAM-PyPSA-coupling on GitHub
    - icon: fontawesome/solid/flask
      link: https://www.pik-potsdam.de/en/institute/labs/energy-transition/energy-transition-lab
      name: PIK Energy Transition Lab

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Due to snakemake workflow, we need to include the 'scripts' directory in the python path
plugins:
- search
- gen-files:
    scripts:
    - docs/autogen_ref_pages.py
- literate-nav:
    nav_file: reference_nav.yml
- mkdocstrings:
    default_handler: python
    handlers:
      python:
        paths: ["./src/iampypsa"]

nav:
  - Home: index.md
  - Getting started:
    - Overview: getting-started/index.md
    - Integrating a PyPSA model: getting-started/integrating-a-model.md
    - Data exchange: getting-started/data-exchange.md
    - Technology mapping: getting-started/technology-mapping.md
    - Downscaling demand: getting-started/downscaling-demand.md
    - Harmonising capacities: getting-started/harmonising-capacities.md
    - Sector coupling: getting-started/sector-coupling.md
    - Adding a new IAM: getting-started/adding-an-iam.md
  - Architecture: architecture.md
  - Migrating a consumer: migration.md
  - Reference: docs/reference/
