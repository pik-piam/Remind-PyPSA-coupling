[project]
name = "REMIND-PyPSA-coupling"
version = "0.2.0"
description = "Tools to couple the REMIND IAM and PyPSA power models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>1.9", 
    "pandas>2", 
    "pyyaml", 
    "country_converter",
    "pytest"]

[project.urls]
Homepage = "https://github.com/pik-piam/Remind-PyPSA-coupling/"
Documentation = "https://pik-piam.github.io/Remind-PyPSA-coupling/"

# eg `uv pip install -r pyproject.toml --extra release`
[project.optional-dependencies]
jupyter = ["ipykernel","ipython"]
gdx = ["gamspy"]
ssp = ["httpx"]   # live SSP fetch from the IIASA API (rpycpl.io.ssp.fetch_ssp_data)
docu= ["mkdocs", "mkdocs_gen_files", "mkdocstrings[python]", "mkdocs-literate-nav", "mkdocs-material", "mkdocs-include-dir-to-nav"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
rpycpl = ["data/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
# Pure-Python package: no compiled extensions, so no numpy/cython; twine is a publish tool,
# not a build requirement. A bloated requires list slows/poisons the isolated build env.
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"




