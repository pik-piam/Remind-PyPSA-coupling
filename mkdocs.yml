
site_name: REMIND-PyPSA Coupling Tools

theme:
  name: "material"
docs_dir: "./docs"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Due to snakemake workflow, we need to include the 'scripts' directory in the python path
plugins:
- search
- gen-files:
    scripts:
    - docs/autogen_ref_pages.py
- literate-nav:
    nav_file: reference_nav.yml
- mkdocstrings:
    default_handler: python
    handlers:
      python:
        paths: ["./src/rpycpl"]

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Plugging into a PyPSA workflow: workflow.md
  - Reference:
    - Reference.md